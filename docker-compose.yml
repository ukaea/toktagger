services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      TOKTAGGER_HOST: ${TOKTAGGER_HOST:?}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - api

  api:
    build:
      context: .
      target: production
      args:
        EXTRAS: ${TOKTAGGER_EXTRAS:-}
    image: toktagger:latest
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      DATABASE_MONGO_URL: mongodb://${MONGO_USERNAME:-toktagger}:${MONGO_PASSWORD:?}@mongo:27017
      SERVER_WORKERS: ${SERVER_WORKERS:-4}
      MODELS_MAX_ACTORS: ${MODELS_MAX_ACTORS:-5}
      SERVER_FORWARDED_ALLOW_IPS: "*"
      AUTH_PROVIDER: oidc
      # Empty defaults allow the Keycloak overlay to supply these settings.
      AUTH_ISSUER_URL: ${AUTH_ISSUER_URL:-}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-toktagger}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-}
      AUTH_SCOPES: ${AUTH_SCOPES:-openid profile email}
      AUTH_ROLES_CLAIM: ${AUTH_ROLES_CLAIM:-groups}
      AUTH_ADMIN_GROUP: ${AUTH_ADMIN_GROUP:-toktagger-admins}
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY:?}
      AUTH_PUBLIC_URL: https://${TOKTAGGER_HOST:?}
    volumes:
      - toktagger_data:/data

  mongo:
    image: mongo:${MONGO_VERSION:-8.0}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME:-toktagger}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  caddy_data:
  caddy_config:
  toktagger_data:
  mongo_data:

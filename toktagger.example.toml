# Example TokTagger Configuration File. 
# All settings are optional, and default values are indicated below. 
# To override a setting, uncomment the line and provide your value.

[auth]
# Secret key used to sign auth tokens. If unset, a key is generated and persisted to secret.key under the server cache_dir on first run. Set this explicitly for multi-worker/multi-process deployments so all processes share the same signing key.
# secret_key = '<your value here>'

# Name of the httpOnly cookie holding the session token. Set to __Host-tt_access_token on an HTTPS-only deployment for extra hardening.
# cookie_name = 'tt_access_token'

# Whether to mark the auth cookie Secure (HTTPS only). If unset, it is derived from the scheme of the login request, so local HTTP development works and an HTTPS deployment is hardened automatically. Set this explicitly to true when TLS is terminated by a proxy on a different host, where the forwarded scheme is not visible to the server.
# cookie_secure = '<your value here>'

# SameSite policy for the auth cookie. Only use none if the frontend is served from a different site to the API; this also forces the cookie to be Secure.
# cookie_samesite = 'lax'

# Identity provider. canaille starts and manages a local Canaille OpenID Connect server for you. oidc uses an external provider (for example Keycloak) set by issuer_url, client_id and client_secret.
# provider = 'canaille'

# Issuer URL of the OpenID Connect provider. Required when provider is oidc. It must be the same URL for the browser and for the TokTagger server. Set automatically when provider is canaille.
# issuer_url = '<your value here>'

# OpenID Connect client ID registered for TokTagger at the provider.
# client_id = 'toktagger'

# OpenID Connect client secret. Required when provider is oidc. Generated and stored automatically when provider is canaille.
# client_secret = '<your value here>'

# Space-separated OpenID Connect scopes to request. Add the scope that makes the provider return the roles_claim if it needs one (for example groups for Canaille).
# scopes = 'openid profile email'

# Dotted path to the claim with the user's groups or roles, for example groups or realm_access.roles. The claim can be a list or a single string.
# roles_claim = 'groups'

# Value in roles_claim that gives a user the global admin role. The role is set again from the provider at every sign-in.
# admin_group = 'toktagger-admins'

# URL at which users reach TokTagger, used for the OpenID Connect redirect URI. If unset, it is http://<server.host>:<server.port>.
# public_url = '<your value here>'

# Maximum age of a browser session in seconds. After this time the user must sign in again. Sign-in reads the global role from the provider again.
# session_max_age_seconds = 43200

# Whether to require the client_id in the audience of provider access tokens sent as Bearer tokens.
# verify_bearer_audience = true

# Port for the managed Canaille server. Only used when provider is canaille.
# canaille_port = 8003

# URL at which the browser reaches the managed Canaille server, and the issuer URL. If unset, it is http://<server.host>:<canaille_port>. Only used when provider is canaille.
# canaille_public_url = '<your value here>'

# Password for the first Canaille admin user. If unset, a random password is generated and printed at first start. Only used when provider is canaille.
# canaille_bootstrap_password = '<your value here>'


[database]
# URL of the MongoDB server to connect to as a backend. If not set, uses a local mongita client.
# mongo_url = './toktagger_db'


[models]
# The directory to use for storing ML model weights.
# cache_dir = '/home/runner/.cache/toktagger/models'

# The maximum number of ML models which can be loaded concurrently, set to None to detect automatically and use all available cores.
# max_actors = 5

# The maximum number of GPUs to use for ML model tasks, leave blank to detect automatically and use all available cores.
# max_gpu_actors = '<your value here>'

# Force the set number of GPU actors available, even if insufficient available GPU cores detected on hardware.
# force_num_gpus = false

# Whether to only allow loading of SafeTensors files for added security.
# load_safetensors_only = false

# Whether to enable the loading of model weights files from local disk. Should be disabled for production servers.
# local_load_enabled = true

# Whether to enable the loading of model weights files from Gitlab.
# gitlab_load_enabled = true

# The URL of the Gitlab server to load ML model weights from.
# gitlab_url = '<your value here>'

# The PAT Token to use when connecting to Gitlab to load model weights.
# gitlab_token = '<your value here>'

# Limit the user to load ML model weights from a specific Gitlab project. Leave blank to allow the user to choose.
# gitlab_project_id = '<your value here>'

# Whether to enable the loading of model weights files from Hugging Face.
# huggingface_load_enabled = true

# Limit the user to load ML model weights from a specific Hugging Face userspace / organisation. Leave blank to allow the user to choose.
# huggingface_userspace = '<your value here>'


[sal]
# URL for the SAL server to connect to for JET data loaders.
# host = 'https://sal.jetdata.eu'


[server]
# Address of the host to launch TokTagger on.
# host = 'localhost'

# The port to use for the TokTagger Rest API.
# port = 8002

# Whether to hot reload the TokTagger server on changes to files.
# reload = false

# The number of Gunicorn worker processes to use. If set to 1, runs a single-process uvicorn server instead.
# workers = 1

# The directory to use for storing entries in the Mongita database, if used.
# cache_dir = '/home/runner/.cache/toktagger'

# Comma-separated addresses of reverse proxies whose X-Forwarded-* headers TokTagger trusts. Use `*` only when the proxy is the only host that can reach TokTagger.
# forwarded_allow_ips = '127.0.0.1'

# Seconds after which Gunicorn restarts a silent worker, and the graceful shutdown period.
# gunicorn_timeout = 120

# Origins allowed to make cross-origin requests to the API, for example the frontend dev server. Set to an empty list when the frontend is served by TokTagger itself.
# cors_origins = ['http://localhost:5173']


[uda]
# Host name for the UDA server to connect to for MAST data loaders.
# host = 'uda2.mast.l'

# Database location for MAST-U data
# meta_pluginname = 'MASTU_DB'

# Database location for MAST data
# metanew_pluginname = 'MAST_DB'




services:
  caddy:
    environment:
      KEYCLOAK_HOST: ${KEYCLOAK_HOST:?}
    volumes:
      - ./deploy/caddy/Caddyfile.keycloak:/etc/caddy/Caddyfile:ro
    depends_on:
      keycloak:
        condition: service_healthy

  api:
    depends_on:
      keycloak:
        condition: service_healthy
    environment:
      AUTH_ISSUER_URL: http://keycloak:8080/realms/toktagger
      AUTH_CLIENT_ID: toktagger
      AUTH_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?}

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    restart: unless-stopped
    command: ["start", "--import-realm"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD:?}
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: https://${KEYCLOAK_HOST:?}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET:?}
      TOKTAGGER_PUBLIC_URL: https://${TOKTAGGER_HOST:?}
    volumes:
      - ./deploy/keycloak/toktagger-realm.json:/opt/keycloak/data/import/toktagger-realm.json:ro
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/localhost/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q '"status": "UP"' <&3
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
